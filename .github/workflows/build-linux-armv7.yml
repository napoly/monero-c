name: Build Linux ARMv7 (depends cross-compile)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

env:
  MONERO_VERSION: 0.18.5.1
  MONERO_PROJECT_DIR: submodules/monero-cpp/external/monero-project

jobs:
  build-linux-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Initialize
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install cross toolchain and build tools
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool cmake autotools-dev automake pkg-config \
            bsdmainutils curl git ca-certificates python3 gperf \
            g++-arm-linux-gnueabihf wget bzip2

      - name: Set up QEMU (for running armv7 binaries only)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm

      - name: Build dependencies (contrib/depends)
        run: |
          set -ex
          cd "${MONERO_PROJECT_DIR}/contrib/depends"
          make HOST=arm-linux-gnueabihf -j"$(nproc)"

      - name: Download daemon
        run: |
          set -ex
          FILE="monero-linux-armv7-v${MONERO_VERSION}.tar.bz2"
          FILE_CHECKSUM="bd6693ac411919d474d98c9e7d7bae1f03e7ef7f1d779a15e2ba3a188c958d36"
          TAR_PATH="monero-arm-linux-gnueabihf-v${MONERO_VERSION}/"

          cd /tmp
          wget -qO "${FILE}" "https://downloads.getmonero.org/cli/${FILE}"
          echo "${FILE_CHECKSUM} ${FILE}" | sha256sum -c -

          mkdir -p bin
          tar -jxf "${FILE}" -C bin --strip-components=1 "${TAR_PATH}monerod"

          mkdir -p "${GITHUB_WORKSPACE}/monero-cli"
          cp bin/monerod "${GITHUB_WORKSPACE}/monero-cli/"
          chmod +x "${GITHUB_WORKSPACE}/monero-cli/monerod"

      - name: Node start
        run: |
          ./monero-cli/monerod \
            --p2p-bind-ip=0.0.0.0 \
            --p2p-bind-port=18080 \
            --rpc-bind-port=18081 \
            --log-level=2 \
            --rpc-bind-ip=0.0.0.0 \
            --confirm-external-bind \
            --regtest \
            --no-igd \
            --hide-my-port \
            --non-interactive \
            --detach

      - name: Build Monero project
        run: |
          set -ex
          TOOLCHAIN="${GITHUB_WORKSPACE}/${MONERO_PROJECT_DIR}/contrib/depends/arm-linux-gnueabihf/share/toolchain.cmake"

          cmake -S "${MONERO_PROJECT_DIR}" \
            -B "${MONERO_PROJECT_DIR}/build/release" \
            -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN}" \
            -DSTATIC=ON \
            -DBUILD_64=OFF \
            -DARCH=armv7-a \
            -DCMAKE_CXX_FLAGS="-Wno-psabi" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build "${MONERO_PROJECT_DIR}/build/release" \
            --target wallet cryptonote_protocol \
            -j"$(nproc)"

      - name: Build Monero C++
        run: |
          set -ex
          TOOLCHAIN="${GITHUB_WORKSPACE}/${MONERO_PROJECT_DIR}/contrib/depends/arm-linux-gnueabihf/share/toolchain.cmake"

          cmake -S submodules/monero-cpp -B submodules/monero-cpp/build \
            -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN}" \
            -DCMAKE_CXX_FLAGS="-Wno-psabi"
          cmake --build submodules/monero-cpp/build -j"$(nproc)"

      - name: Upload monero-cpp library
        uses: actions/upload-artifact@v7
        with:
          name: libmonero-cpp-linux-armv7.so
          path: submodules/monero-cpp/build/libmonero-cpp.so

      - name: Build monero-c
        run: |
          set -ex
          TOOLCHAIN="${GITHUB_WORKSPACE}/${MONERO_PROJECT_DIR}/contrib/depends/arm-linux-gnueabihf/share/toolchain.cmake"

          cmake -S MoneroC -B MoneroC/build \
            -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN}" \
            -DCMAKE_CXX_FLAGS="-Wno-psabi"
          cmake --build MoneroC/build

      - name: Upload monero-c
        uses: actions/upload-artifact@v7
        with:
          name: libmonero-c-linux-armv7.so
          path: MoneroC/build/libmonero-c.so

      - name: Build CsharpTestApp
        run: |
          dotnet build CsharpTestApp -maxcpucount:1 -c Release \
            -r linux-arm --self-contained true

      - name: Copy native library
        run: cp MoneroC/build/libmonero-c.so CsharpTestApp/bin/Release/net10.0/linux-arm/

      - name: Run CsharpTestApp
        run: |
          cd CsharpTestApp/bin/Release/net10.0/linux-arm
          chmod +x ./CsharpTestApp
          LD_LIBRARY_PATH=. ./CsharpTestApp